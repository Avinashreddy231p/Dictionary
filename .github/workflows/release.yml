name: Build & Release Flutter APKs

on:
  push:
    branches: [ "1", "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --flavor n8n_prod --release --split-per-abi

      - name: Rename & Organize APKs
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-n8n_prod-armeabi-v7a-release.apk release-apks/Dictionary-v2.3.1-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-n8n_prod-arm64-v8a-release.apk release-apks/Dictionary-v2.3.1-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-n8n_prod-x86_64-release.apk release-apks/Dictionary-v2.3.1-x86_64.apk || true
          cp build/app/outputs/flutter-apk/*.apk release-apks/ || true

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dictionary-Release-APKs
          path: release-apks/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref_name == '1'
        with:
          tag_name: ${{ github.ref_name == '1' && 'v2.3.1-latest' || github.ref_name }}
          name: Release ${{ github.ref_name == '1' && 'v2.3.1-latest' || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-apks/*.apk
          body: |
            🚀 **Dictionary Release Build**

            ### Optimized Architecture APKs:
            * **ARM64 (64-bit)**: `Dictionary-v2.3.1-arm64-v8a.apk` *(Recommended for most modern phones)*
            * **ARMv7 (32-bit)**: `Dictionary-v2.3.1-armeabi-v7a.apk` *(For older Android devices)*
            * **x86_64 (64-bit)**: `Dictionary-v2.3.1-x86_64.apk` *(For emulators and tablets)*

            ### Key Features Included:
            * ⚡ Zero-lag card navigation & instant screen opening.
            * 📚 Curated **Advanced C1 & C2 Vocabulary** initial seed collection.
            * 🎙️ On-demand speech recognition & pronunciation practice.
            * 🎨 Customizable Material 3 theme & 60+ Pantone accent colors.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
