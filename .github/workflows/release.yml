name: Multi-Platform Build & Release

on:
  push:
    branches: [ "1", "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. ANDROID BUILD
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --flavor n8n_prod --release --split-per-abi

      - name: Organize & Rename Android APKs
        run: |
          mkdir -p artifacts
          for file in $(find build/ -name "*.apk"); do
            if [[ "$file" == *"arm64-v8a"* ]]; then
              cp "$file" artifacts/Dictionary-v2.3.1-arm64-v8a.apk
            elif [[ "$file" == *"armeabi-v7a"* ]]; then
              cp "$file" artifacts/Dictionary-v2.3.1-armeabi-v7a.apk
            elif [[ "$file" == *"x86_64"* ]]; then
              cp "$file" artifacts/Dictionary-v2.3.1-x86_64.apk
            else
              cp "$file" artifacts/Dictionary-v2.3.1-universal.apk
            fi
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/*

  # 2. WINDOWS BUILD
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $releaseDir = Get-ChildItem -Path build\windows -Recurse -Directory -Filter "Release" | Select-Object -First 1
          if ($releaseDir) {
              Compress-Archive -Path "$($releaseDir.FullName)\*" -DestinationPath artifacts\Dictionary-v2.3.1-Windows-x64.zip
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: artifacts/*

  # 3. LINUX BUILD
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Tarball
        run: |
          mkdir -p artifacts
          BUNDLE_DIR=$(find build/linux -type d -name "bundle" | head -n 1)
          if [ -n "$BUNDLE_DIR" ]; then
            tar -czvf artifacts/Dictionary-v2.3.1-Linux-x64.tar.gz -C "$BUNDLE_DIR" .
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: artifacts/*

  # 4. IOS BUILD
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Payload Zip
        run: |
          mkdir -p artifacts
          APP_DIR=$(find build/ios -type d -name "Runner.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r artifacts/Dictionary-v2.3.1-iOS-Unsigned.ipa Payload
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: artifacts/*

  # 5. CREATE GITHUB RELEASE WITH ALL PLATFORM BINARIES
  publish-release:
    name: Create & Publish Multi-Platform Release
    needs: [build-android, build-windows, build-linux, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: release-binaries

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-app
          path: release-binaries

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-app
          path: release-binaries

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-app
          path: release-binaries

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref_name == '1'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.3.1' }}
          name: Dictionary Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.3.1' }}
          draft: false
          prerelease: false
          files: release-binaries/*
          body: |
            🎉 **Dictionary Multi-Platform Release Build (v2.3.1)**

            ### 📱 Android Release Builds:
            * **ARM64 (64-bit)**: `Dictionary-v2.3.1-arm64-v8a.apk` *(Recommended for modern Android smartphones)*
            * **ARMv7 (32-bit)**: `Dictionary-v2.3.1-armeabi-v7a.apk` *(Legacy Android devices)*
            * **x86_64 (64-bit)**: `Dictionary-v2.3.1-x86_64.apk` *(Emulators & Chromebooks)*

            ### 💻 Desktop Release Builds:
            * **🪟 Windows (x64)**: `Dictionary-v2.3.1-Windows-x64.zip`
            * **🐧 Linux (x64)**: `Dictionary-v2.3.1-Linux-x64.tar.gz`

            ### 🍏 iOS Release Build:
            * **🍏 iOS**: `Dictionary-v2.3.1-iOS-Unsigned.ipa` *(Unsigned IPA for Sideloading / AltStore / TestFlight)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
